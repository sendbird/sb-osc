name: Linters

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  flake8_py3:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2
      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.11
      - name: flake8
        run: |
          python -m pip install flake8
          flake8
